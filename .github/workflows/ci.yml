name: CI Tests

on:
  pull_request:
    branches: [main]

jobs:
  server_lint:
    name: Server Linting CI Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout to repository
        uses: actions/checkout@v4
      - name: Install Dependencies
        uses: ./.github/actions/setup-ci-server
      - name: Run Linting Check
        run: ls && pnpm run lint
        working-directory: ./server
  server_typecheck:
    name: Server Typecheck CI Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout to repository
        uses: actions/checkout@v4
      - name: Install Dependencies
        uses: ./.github/actions/setup-ci-server
      - name: Run Typecheck
        run: pnpm run tsc
        working-directory: ./server

  client_lint:
    name: Client Linting CI Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout to repository
        uses: actions/checkout@v4
      - name: Install Dependencies
        uses: ./.github/actions/setup-ci-client
      - name: Run Linting Check
        run: ls && pnpm run lint
        working-directory: ./client
  client_typecheck:
    name: Client Typecheck CI Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout to repository
        uses: actions/checkout@v4
      - name: Install Dependencies
        uses: ./.github/actions/setup-ci-client
      - name: Run Linting Check
        run: pnpm run tsc
        working-directory: ./client

  docker_build:
    name: Build Docker Containers
    runs-on: ubuntu-latest
    needs: [server_lint, server_typecheck, client_lint, client_typecheck]
    steps:
      - name: Checkout to repository
        uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/actions/setup-ci-env
      - name: Check the server successfully builds
        run: docker compose build server-prod
      - name: Check the client successfully builds
        run: docker compose build client-prod
      - name: Check that containers start successfully
        run: docker compose up --wait --wait-timeout 90 server-prod client-prod
      - name: Log output of containers
        run: docker compose logs server-prod client-prod
        if: always()
